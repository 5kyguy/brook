[package]
name = "brook"
version = "0.1.3"
description = "Offline local music player"
authors = ["sky"]
edition = "2021"

[workspace]
members = ["theme"]

[lib]
name = "brook_lib"
crate-type = ["lib", "cdylib"]

[build-dependencies]
tauri-build = { version = "~2.7.1", features = [] }

[dependencies]
tauri = { version = "~2.12.1", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
brook-theme = { path = "theme" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
dirs = "6"
lofty = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
rayon = "1"
symphonia = { version = "0.5", features = ["mp3", "flac", "vorbis", "pcm", "aac", "isomp4", "ogg", "wav"] }
rodio = "0.19"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rfd = "0.15"
rustfft = "6.2"
num-complex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = "0.8"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }

[profile.dev]
incremental = true

[profile.release]
lto = true
codegen-units = 1
